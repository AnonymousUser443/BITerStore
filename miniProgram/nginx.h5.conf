server {
  listen 80;
  absolute_redirect off;
  root /usr/share/nginx/html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # Browser-facing routes use query parameters because Taro's H5 router only
  # registers static paths. Preserve older pretty links by canonicalizing them
  # before the client bundle starts.
  location ~ ^/books/([A-Za-z0-9_-]+)$ {
    return 302 /books?id=$1;
  }
  location ~ ^/messages/notifications/(like|comment|system|follow)$ {
    return 302 /notifications?type=$1;
  }
  location ~ ^/messages/([A-Za-z0-9_-]+)$ {
    return 302 /chat?id=$1;
  }
  location ~ ^/states/([A-Za-z0-9_-]+)$ {
    return 302 /states?type=$1;
  }

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }
  location ~ ^/(welcome|onboarding|login|home|search|category|books|publish|messages|notifications|chat|profile|profile/edit|feedback|favorites|my-listings|states)/?$ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }
  location = /robots.txt { try_files $uri =404; default_type text/plain; }
  location = /sitemap.xml { try_files $uri =404; default_type application/xml; }
  location ~* \.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
  location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    try_files $uri @app_not_found;
  }
  location @app_not_found {
    return 404;
  }
}
