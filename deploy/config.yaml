services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: biterstore, POSTGRES_USER: biterstore, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [postgres-data:/var/lib/postgresql/data]
    command: ["postgres","-c","shared_buffers=2GB","-c","effective_cache_size=6GB","-c","max_connections=150"]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U biterstore"], interval: 5s, timeout: 3s, retries: 20 }
    deploy: { resources: { limits: { cpus: "4", memory: 8G } } }
    networks: [data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be configured}"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        test -n "$${REDIS_PASSWORD}"
        printf 'user default off\nuser biterstore on >%s ~* +@connection +get +set +setex +getdel +del +incr +expire +ttl +eval\n' "$${REDIS_PASSWORD}" > /tmp/users.acl
        exec redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy allkeys-lru --aclfile /tmp/users.acl
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD-SHELL","redis-cli --user biterstore -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping"], interval: 5s, timeout: 3s, retries: 20 }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [data]
  bit-login:
    build:
      context: ./bit-login
      args:
        BIT_LOGIN_COMMIT: 5d537ca6123b405666b82eabc2328b8f4c70b6ca
        INSTALL_DDDDOCR: "1"
    restart: unless-stopped
    environment:
      WORKERS: "4"
      AUTH_DB_PATH: /app/data/auth.db
      AUTH_CHALLENGE_TTL: "300"
      AUTH_SESSION_TTL: "1800"
      BASE_URL: https://store.young581.com/bit-login
      ALLOWED_CORS_ORIGINS: https://store.young581.com
      REGISTRATION_JWT_PRIVATE_KEY_FILE: /run/secrets/registration-private.pem
      REGISTRATION_JWT_ALLOWED_AUDIENCES: biterstore
      REGISTRATION_JWT_ISSUER: bit-login
      REGISTRATION_JWT_TTL: "300"
      REGISTRATION_JWT_KEY_ID: registration-1
    volumes:
      - bit-login-data:/app/data
      - ./secrets/bit-login-registration-private.pem:/run/secrets/registration-private.pem:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:16384/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy: { resources: { limits: { cpus: "2", memory: 2G } } }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [app, egress]
  api:
    build: ../server
    restart: unless-stopped
    dns: ["1.1.1.1"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://biterstore:${POSTGRES_PASSWORD}@postgres:5432/biterstore
      REDIS_URL: redis://redis:6379
      REDIS_USERNAME: biterstore
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      BIT_LOGIN_HEALTH_URL: http://bit-login:16384/
      READINESS_TIMEOUT_MS: "5000"
      NODE_ENV: production
      ALLOW_DEV_AUTH: "false"
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
    volumes: [api-uploads:/app/uploads]
    deploy: { resources: { limits: { cpus: "4", memory: 4G } } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [data, app, egress]
  h5:
    build:
      context: ..
      dockerfile: miniProgram/Dockerfile.h5
      args:
        BITERSTORE_API_URL: /api/v1
        BIT_LOGIN_URL: "${BIT_LOGIN_URL:-/bit-login}"
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [app]
  admin:
    build: ../admin
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [app]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:${BIND_PORT:-18081}:80"]
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on:
      api: { condition: service_healthy }
      h5: { condition: service_started }
      admin: { condition: service_started }
      bit-login: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    networks: [default, app]
  backup:
    build: ./backup
    restart: unless-stopped
    user: "${BACKUP_RUN_UID:-1000}:${BACKUP_RUN_GID:-1000}"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ENCRYPTION_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      GNUPGHOME: /tmp/gnupg
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETENTION_DAYS: "7"
    secrets: [backup_passphrase]
    volumes: [./backups:/backups]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup-health.sh"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 240s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [data]
volumes: { postgres-data: {}, redis-data: {}, bit-login-data: {}, api-uploads: {} }
networks:
  default:
    name: deploy_default
  app:
    internal: true
  data:
    internal: true
  egress: {}
secrets:
  backup_passphrase:
    file: "${BACKUP_PASSPHRASE_FILE:-./secrets/backup-passphrase.txt}"
