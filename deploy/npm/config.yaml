services:
  npm:
    image: jc21/nginx-proxy-manager:2.15.1
    container_name: biterstore-npm
    restart: unless-stopped
    ports:
      - "127.0.0.1:19080:80"
      - "127.0.0.1:19081:81"
      - "127.0.0.1:19443:443"
    environment:
      TZ: Asia/Shanghai
      DISABLE_IPV6: "true"
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - default
      - biterstore

networks:
  biterstore:
    external: true
    name: deploy_default
