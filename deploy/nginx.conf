map $http_x_forwarded_proto $biterstore_edge_proto {
  default $scheme;
  http http;
  https https;
}

map $http_cf_visitor $biterstore_forwarded_proto {
  default $biterstore_edge_proto;
  '{"scheme":"https"}' https;
  '{"scheme":"http"}' http;
}

map $biterstore_forwarded_proto $biterstore_redirect_https {
  default 1;
  https 0;
}

map $biterstore_forwarded_proto $biterstore_hsts {
  default "";
  https "max-age=31536000; includeSubDomains";
}

# Cloudflare supplies the original address. Validate its shape and otherwise
# fall back to the direct peer. The global safety cap remains authoritative if
# an origin is temporarily reachable without Cloudflare.
map $http_cf_connecting_ip $biterstore_client_address {
  default $remote_addr;
  ~^[0-9A-Fa-f:.]+$ $http_cf_connecting_ip;
}

map "$request_method:$uri:$arg_q" $biterstore_catalog_list_key {
  default "";
  ~^GET:/api/v1/listings:$ $biterstore_client_address;
}

map "$request_method:$uri:$arg_q" $biterstore_catalog_search_key {
  default "";
  ~^GET:/api/v1/listings:.+$ $biterstore_client_address;
}

map "$request_method:$uri" $biterstore_catalog_detail_key {
  default "";
  ~^GET:/api/v1/listings/[A-Za-z0-9_-]+$ $biterstore_client_address;
}

# Only the four challenge operations used by the clients are reachable. $uri
# excludes query strings, while the method prefix prevents accidental exposure
# of BIT-Login's student-data, cookie, OpenAPI, ICS and temporary-file routes.
map "$request_method:$uri" $biterstore_bit_login_allowed {
  default 0;
  "POST:/bit-login/api/auth/start" 1;
  ~^GET:/bit-login/api/auth/[A-Za-z0-9_-]+$ 1;
  ~^DELETE:/bit-login/api/auth/[A-Za-z0-9_-]+$ 1;
  ~^POST:/bit-login/api/auth/[A-Za-z0-9_-]+/sms$ 1;
  ~^POST:/bit-login/api/auth/[A-Za-z0-9_-]+/registration-token$ 1;
}

map "$request_method:$uri" $biterstore_bit_login_start_key {
  default "";
  "POST:/bit-login/api/auth/start" $biterstore_client_address;
}

map "$request_method:$uri" $biterstore_upload_key {
  default "";
  ~^(POST|PUT|DELETE):/api/v1/uploads(?:/.*)?$ $server_name;
}

map "$request_method:$uri" $biterstore_recognition_key {
  default "";
  "POST:/api/v1/books/isbn/recognize" $server_name;
}

map "$request_method:$uri" $biterstore_book_lookup_key {
  default "";
  ~^GET:/api/v1/books/isbn/[^/]+$ $biterstore_client_address;
}

map "$request_method:$uri" $biterstore_book_lookup_global_key {
  default "";
  ~^GET:/api/v1/books/isbn/[^/]+$ $server_name;
}

map "$request_method:$uri" $biterstore_media_key {
  default "";
  ~^GET:/(?:api/v1/)?media/[A-Za-z0-9_-]+$ $biterstore_client_address;
}

map "$request_method:$uri" $biterstore_auth_exchange_key {
  default "";
  ~^POST:/api/v1/auth/(?:campus|wechat/mini-program(?:/bind)?|wechat/web/start|refresh|logout)$ $biterstore_client_address;
}

map "$request_method:$uri" $biterstore_auth_exchange_global_key {
  default "";
  ~^POST:/api/v1/auth/(?:campus|wechat/mini-program(?:/bind)?|wechat/web/start|refresh|logout)$ $server_name;
}

map "$request_method:$uri" $biterstore_auth_poll_key {
  default "";
  "GET:/api/v1/auth/wechat/web/status" $biterstore_client_address;
}

# Omit query strings from access logs so OAuth state and similar one-time
# values cannot leak through the default `$request` field.
log_format biterstore_sanitized '$time_local "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';

# Last-resort aggregate protection. Per-client and per-route quotas are
# enforced by the API with Redis; this cap still bounds traffic if forwarded
# address metadata is unavailable or deliberately spoofed.
limit_req_zone $server_name zone=biterstore_api_global:10m rate=200r/s;
limit_conn_zone $server_name zone=biterstore_api_connections:10m;
limit_req_zone $server_name zone=biterstore_bit_login_global:10m rate=30r/s;
limit_req_zone $biterstore_bit_login_start_key zone=biterstore_bit_login_start:10m rate=5r/s;
limit_req_zone $biterstore_upload_key zone=biterstore_upload_global:10m rate=20r/s;
limit_req_zone $biterstore_recognition_key zone=biterstore_recognition_global:10m rate=5r/s;
limit_req_zone $biterstore_book_lookup_key zone=biterstore_book_lookup:10m rate=30r/m;
limit_req_zone $biterstore_book_lookup_global_key zone=biterstore_book_lookup_global:10m rate=2r/s;
limit_req_zone $biterstore_media_key zone=biterstore_media:10m rate=180r/m;
limit_req_zone $biterstore_auth_exchange_key zone=biterstore_auth_exchange:10m rate=30r/m;
limit_req_zone $biterstore_auth_exchange_global_key zone=biterstore_auth_exchange_global:10m rate=10r/s;
limit_req_zone $biterstore_auth_poll_key zone=biterstore_auth_poll:10m rate=120r/m;
limit_req_zone $biterstore_catalog_list_key zone=biterstore_catalog_list:10m rate=60r/m;
limit_req_zone $biterstore_catalog_search_key zone=biterstore_catalog_search:10m rate=30r/m;
limit_req_zone $biterstore_catalog_detail_key zone=biterstore_catalog_detail:10m rate=120r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 6m;
  access_log /var/log/nginx/access.log biterstore_sanitized;

  # Also protect the redirect response itself. Location blocks repeat these
  # directives because Nginx does not inherit parent add_header directives
  # once a child adds its own header (for example Cache-Control).
  add_header Strict-Transport-Security $biterstore_hsts always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

  # Browser sessions use Secure cookies in production. Keep every public
  # entry point on HTTPS, including links opened inside WeChat WebView.
  if ($biterstore_redirect_https) {
    return 308 https://store.young581.com$request_uri;
  }

  location /bit-login/ {
    if ($biterstore_bit_login_allowed = 0) { return 404; }
    limit_req zone=biterstore_bit_login_global burst=60 nodelay;
    limit_req zone=biterstore_bit_login_start burst=5 nodelay;
    limit_req_status 429;
    rewrite ^/bit-login(/.*)$ $1 break;
    proxy_pass http://bit-login:16384;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $biterstore_client_address;
    proxy_connect_timeout 10s;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security $biterstore_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }

  location /api/ {
    limit_req zone=biterstore_api_global burst=300 nodelay;
    limit_req zone=biterstore_upload_global burst=30 nodelay;
    limit_req zone=biterstore_recognition_global burst=5 nodelay;
    limit_req zone=biterstore_book_lookup burst=10 nodelay;
    limit_req zone=biterstore_book_lookup_global burst=10 nodelay;
    limit_req zone=biterstore_media burst=60 nodelay;
    limit_req zone=biterstore_auth_exchange burst=10 nodelay;
    limit_req zone=biterstore_auth_exchange_global burst=30 nodelay;
    limit_req zone=biterstore_auth_poll burst=30 nodelay;
    limit_req zone=biterstore_catalog_list burst=20 nodelay;
    limit_req zone=biterstore_catalog_search burst=10 nodelay;
    limit_req zone=biterstore_catalog_detail burst=30 nodelay;
    limit_conn biterstore_api_connections 300;
    limit_req_status 429;
    limit_conn_status 429;
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $biterstore_client_address;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    add_header Strict-Transport-Security $biterstore_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
  }

  location /media/ {
    # Keep the legacy short URL compatible with the API's global prefix.
    limit_req zone=biterstore_media burst=60 nodelay;
    limit_req_status 429;
    rewrite ^/media/(.*)$ /api/v1/media/$1 break;
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $biterstore_client_address;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=30, must-revalidate" always;
    add_header Strict-Transport-Security $biterstore_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'" always;
  }

  # Handle the slashless entry at the public gateway. Letting the inner static
  # server add the slash would emit an http:// redirect because TLS terminates
  # at the edge, which leaves some embedded browsers on a blank page.
  location = /admin {
    return 308 https://store.young581.com/admin/;
  }

  location /admin/ {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security $biterstore_hsts always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }

  location / {
    proxy_pass http://h5:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Strict-Transport-Security $biterstore_hsts always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' https://store.young581.com wss://store.young581.com; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }
}
