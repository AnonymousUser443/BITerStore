map $http_x_forwarded_proto $biterstore_forwarded_proto {
  default $scheme;
  ~*^https$ https;
  ~*^http$ http;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 6m;

  location /api/ {
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /admin/ {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Frame-Options DENY always;
  }

  location / {
    proxy_pass http://h5:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
