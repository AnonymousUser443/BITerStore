map $http_x_forwarded_proto $biterstore_forwarded_proto {
  default $scheme;
  ~*^https$ https;
  ~*^http$ http;
}

map $http_x_forwarded_proto $biterstore_redirect_https {
  default 0;
  ~*^http$ 1;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 6m;

  # Browser sessions use Secure cookies in production. Keep every public
  # entry point on HTTPS, including links opened inside WeChat WebView.
  if ($biterstore_redirect_https) {
    return 308 https://store.young581.com$request_uri;
  }

  location /bit-login/ {
    proxy_pass http://bit-login:16384/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_read_timeout 40s;
    proxy_send_timeout 40s;
    add_header Cache-Control "no-store" always;
  }

  location /api/ {
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /media/ {
    proxy_pass http://api:3100;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location /admin/ {
    proxy_pass http://admin:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header X-Frame-Options DENY always;
  }

  location / {
    proxy_pass http://h5:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $biterstore_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
